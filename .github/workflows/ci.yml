name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit tests + ransomware simulation
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nas-anomaly-sentinel:ci .
      - name: Smoke test (dashboard answers)
        run: |
          mkdir -p demo-data data
          docker run -d --name s -p 8080:8080 -e WATCH_PATHS=demo=/watch/demo \
            -v "$PWD/demo-data:/watch/demo:ro" -v "$PWD/data:/data" nas-anomaly-sentinel:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/status && exit 0; sleep 1; done
          docker logs s; exit 1
