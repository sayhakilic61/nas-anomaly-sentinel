name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit tests + ransomware simulation
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker buildx build --load -t nas-anomaly-sentinel:ci .
          docker image ls nas-anomaly-sentinel
      - name: Smoke test (dashboard answers)
        run: |
          docker run -d --name s -e WATCH_PATHS=demo=/tmp nas-anomaly-sentinel:ci
          for i in $(seq 1 30); do
            if docker exec s python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=2)"; then
              echo "Dashboard is up"; exit 0
            fi
            sleep 1
          done
          docker ps -a
          docker logs s
          exit 1
